<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anéis Pandora</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 24px 16px 60px;
            color: #1a1a1a;
            background: #fafaf9;
        }
        h1 { font-size: 1.4rem; margin: 0 0 4px; }
        .atualizado { font-size: 0.85rem; color: #666; margin-bottom: 24px; }

        .grade {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        .card {
            background: white;
            border: 1px solid #e5e5e0;
            border-radius: 12px;
            padding: 16px;
            position: relative;
        }
        .card.desconto {
            border-color: #f59e0b;
            background: linear-gradient(135deg, #fffbeb, white 60%);
        }
        .card.favorito {
            border-color: #ec4899;
        }

        .nome { font-weight: 600; font-size: 1rem; padding-right: 30px; margin-bottom: 8px; }

        .precos { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
        .preco-brl { font-size: 1.3rem; font-weight: 700; }
        .preco-usd { font-size: 0.85rem; color: #888; }

        .selo-desconto {
            display: inline-block;
            background: #f59e0b;
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .rodape { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .rodape a {
            color: #16a34a;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .rodape a:hover { text-decoration: underline; }

        .botao-favorito {
            position: absolute;
            top: 14px;
            right: 12px;
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
            color: #ccc;
        }
        .botao-favorito.ativo { color: #ec4899; }

        .vazio { text-align: center; color: #666; padding: 40px 0; }
    </style>
</head>
<body>
    <h1>💍 Anéis Pandora</h1>

    <select id="seletorData" style="font-size: 0.9rem; padding: 8px; margin-bottom: 16px; width: 100%; max-width: 320px;"></select>
    <div class="atualizado" id="atualizado">Carregando...</div>

    <div class="grade" id="grade"></div>

    <script>
        const CHAVE_FAVORITOS = "aneis-favoritos";

        function pegarFavoritos() {
            try {
                return JSON.parse(localStorage.getItem(CHAVE_FAVORITOS)) || [];
            } catch {
                return [];
            }
        }

        function alternarFavorito(nomeAnel) {
            const favoritos = pegarFavoritos();
            const indice = favoritos.indexOf(nomeAnel);
            if (indice === -1) favoritos.push(nomeAnel);
            else favoritos.splice(indice, 1);
            localStorage.setItem(CHAVE_FAVORITOS, JSON.stringify(favoritos));
        }

        function renderizar(aneis) {
            const favoritos = pegarFavoritos();

            const ordenados = [...aneis].sort((a, b) => {
                const pesoA = (favoritos.includes(a.anel) ? 2 : 0) + (a.desconto === "Sim" ? 1 : 0);
                const pesoB = (favoritos.includes(b.anel) ? 2 : 0) + (b.desconto === "Sim" ? 1 : 0);
                return pesoB - pesoA;
            });

            const grade = document.getElementById("grade");

            if (ordenados.length === 0) {
                grade.innerHTML = '<div class="vazio">Nenhum dado ainda.</div>';
                return;
            }

            grade.innerHTML = ordenados.map((a) => {
                const ehFavorito = favoritos.includes(a.anel);
                const emDesconto = a.desconto === "Sim";

                return `
                    <div class="card ${emDesconto ? 'desconto' : ''} ${ehFavorito ? 'favorito' : ''}">
                        <button class="botao-favorito ${ehFavorito ? 'ativo' : ''}" data-anel="${a.anel}" title="Favoritar">
                            ${ehFavorito ? '♥' : '♡'}
                        </button>
                        <div class="nome">${a.anel}</div>
                        ${emDesconto ? `<div class="selo-desconto">🔥 -${a.percentualDesconto}</div>` : ''}
                        <div class="precos">
                            <span class="preco-brl">${a.precoBRL}</span>
                            <span class="preco-usd">${a.precoUSD}</span>
                        </div>
                        <div class="rodape">
                            <a href="${a.link}" target="_blank" rel="noopener">Ver na Pandora →</a>
                        </div>
                    </div>
                `;
            }).join("");

            grade.querySelectorAll(".botao-favorito").forEach((botao) => {
                botao.addEventListener("click", () => {
                    alternarFavorito(botao.dataset.anel);
                    renderizar(aneis);
                });
            });
        }

        function preencherSeletorDeData(execucoes) {
            const seletor = document.getElementById("seletorData");

            seletor.innerHTML = execucoes
                .map((exec, indice) => ({ indice, exec }))
                .reverse()
                .map(({ indice, exec }) => {
                    const rotulo = new Date(exec.dataHora).toLocaleString("pt-BR", {
                        day: "2-digit", month: "2-digit", year: "numeric",
                        hour: "2-digit", minute: "2-digit"
                    });
                    const ehMaisRecente = indice === execucoes.length - 1;
                    return `<option value="${indice}">${rotulo}${ehMaisRecente ? " (mais recente)" : ""}</option>`;
                })
                .join("");

            seletor.value = execucoes.length - 1;
        }

        fetch("dados.json?_=" + Date.now())
            .then((r) => r.json())
            .then((dados) => {
                const execucoes = dados.execucoes || [];

                if (execucoes.length === 0) {
                    document.getElementById("atualizado").textContent = "Nenhuma busca registrada ainda.";
                    document.getElementById("seletorData").style.display = "none";
                    return;
                }

                preencherSeletorDeData(execucoes);

                function mostrarExecucao(indice) {
                    const exec = execucoes[indice];
                    document.getElementById("atualizado").textContent =
                        "Mostrando busca de: " + new Date(exec.dataHora).toLocaleString("pt-BR");
                    renderizar(exec.aneis);
                }

                document.getElementById("seletorData").addEventListener("change", (e) => {
                    mostrarExecucao(Number(e.target.value));
                });

                mostrarExecucao(execucoes.length - 1);
            })
            .catch(() => {
                document.getElementById("atualizado").textContent = "Não consegui carregar os dados ainda.";
            });
    </script>
</body>
</html>
